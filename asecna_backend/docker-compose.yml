# La cle `version` est obsolete depuis Compose v2 et provoque un avertissement.
services:
  db:
    image: postgres:15-alpine
    container_name: asecna_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=asecna_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    networks:
      - asecna_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: asecna_backend
    volumes:
      - .:/app
    environment:
      # Reglages de DEVELOPPEMENT : on surcharge le defaut production de l'image.
      # USE_POSTGRES active la base PostgreSQL du service `db` ci-dessus ; sans
      # cette variable, development.py retombe sur SQLite et le conteneur
      # PostgreSQL n'etait jamais utilise.
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - USE_POSTGRES=True
      - SECRET_KEY=django-insecure-docker-dev-key-asecna
      - DB_NAME=asecna_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - asecna_network

networks:
  asecna_network:
    driver: bridge

volumes:
  postgres_data:
